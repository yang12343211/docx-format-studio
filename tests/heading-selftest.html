<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>标题识别 · 浏览器自测</title>
<style>body{font:13px/1.6 monospace;margin:12px}#f{width:0;height:0;border:0;position:absolute;left:-9999px}</style>
</head>
<body>
<pre id="out">RUNNING</pre>
<iframe id="f" src="/index.html"></iframe>
<script>
(async function () {
  var lines = [], out = document.getElementById('out');
  function log(s) { lines.push(String(s)); out.textContent = lines.join('\n'); }
  var pass = 0, fail = 0;
  function t(name, cond, extra) {
    if (cond) { pass++; log('  \u2713 ' + name); }
    else { fail++; log('  \u2717 ' + name + (extra !== undefined ? '  -> ' + extra : '')); }
  }
  function waitFor(fn, ms, label) {
    return new Promise(function (res, rej) {
      var t0 = Date.now();
      (function poll() {
        var v; try { v = fn(); } catch (e) { v = false; }
        if (v) return res(v);
        if (Date.now() - t0 > ms) return rej(new Error('等待超时: ' + label));
        setTimeout(poll, 50);
      })();
    });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  try {
    var f = document.getElementById('f');
    await waitFor(function () {
      if (!f.contentDocument || f.contentDocument.readyState !== 'complete') return false;
      var w = f.contentWindow;
      return w.DocxCore && w.FormatBuilder && f.contentDocument.getElementById('run') ? true : false;
    }, 25000, '页面与模块就绪');

    var doc = f.contentDocument, win = f.contentWindow;

    /* ============================ 0. 公共工具 ============================ */
    var input = doc.getElementById('file-doc');
    var capturedBytes = null, capturedReport = null;

    /* 拦截页面真正调用的排版引擎，拿到报告与产物字节 */
    var realApply = win.DocxCore.applyFormat;
    win.DocxCore.applyFormat = async function (buf, spec, opts) {
      var r = await realApply.call(win.DocxCore, buf, spec, opts);
      capturedReport = r.report;
      capturedBytes = new win.Uint8Array(r.data);
      return r;
    };

    async function openLevel(key) {
      var b = doc.querySelector('#fb-style-tabs .fb-tab[data-style="' + key + '"]');
      if (b) b.click();
      await sleep(60);
    }
    async function setChapter(pageBreak, blanks) {
      await openLevel('h1');
      var a = doc.querySelector('input[data-f="chapterPageBreak"]');
      var b = doc.querySelector('input[data-f="chapterBlanks"]');
      if (!a || !b) return false;
      a.checked = !!pageBreak; b.checked = !!blanks;
      a.dispatchEvent(new win.Event('change', { bubbles: true }));
      b.dispatchEvent(new win.Event('change', { bubbles: true }));
      await sleep(60);
      return true;
    }
    /* 载入夹具 → 等文档真正就绪（chip 上出现文件名且提示已就绪）→ 点运行 → 等产物 */
    async function loadFixture(name) {
      capturedBytes = null; capturedReport = null;
      var ab = await (await fetch('/tests/fixtures/' + name)).arrayBuffer();
      var fl = new win.File([ab], name, { type: win.DocxCore.DOCX_MIME });
      var d = new win.DataTransfer();
      d.items.add(fl);
      input.files = d.files;
      input.dispatchEvent(new win.Event('change', { bubbles: true }));

      await waitFor(function () {
        var nm = doc.getElementById('name-doc'), mt = doc.getElementById('meta-doc');
        return nm && nm.textContent === name && mt && /已就绪/.test(mt.textContent);
      }, 10000, '文档就绪 ' + name);
      await sleep(100);

      await waitFor(function () { return !doc.getElementById('run').disabled; }, 8000, '运行按钮可用 ' + name);
      doc.getElementById('run').click();
      await waitFor(function () { return capturedBytes !== null; }, 25000, name + ' 排版完成');
      await sleep(150);
      return capturedBytes;
    }
    function parasOf(xml) {
      var list = [], re = /<w:p\b[\s\S]*?<\/w:p>/g, m;
      while ((m = re.exec(xml))) list.push(m[0]);
      return list;
    }
    function textOf(p) {
      var s = '', m, re = /<w:t[^>]*>([\s\S]*?)<\/w:t>/g;
      while ((m = re.exec(p))) s += m[1];
      return s.trim();
    }
    async function docXml(bytes) {
      var zip = await win.JSZip.loadAsync(bytes || capturedBytes);
      return await zip.file('word/document.xml').async('string');
    }
    async function stylesXml(bytes) {
      var zip = await win.JSZip.loadAsync(bytes || capturedBytes);
      return await zip.file('word/styles.xml').async('string');
    }
    function noteTxt() { return doc.getElementById('result-note').textContent; }

    /* ============================ 1. 预设与章版式开关 ============================ */
    log('=== 1. 套用「课程设计报告规范」预设 ===');
    var manualTab = doc.querySelector('.mode-tab[data-mode="manual"]');
    if (manualTab) manualTab.click();
    await sleep(100);
    var presetBtn = doc.querySelector('#fb-presets [data-preset="report-cn"]');
    t('预设按钮存在', !!presetBtn);
    presetBtn.click();
    await sleep(120);

    /* 预设自带「一级标题（章）版式」（另起一页 + 前后各空一行）。
       2~7 节验证的是标题层级 / 缩进 / 水平线，插进去的分页和空行会把段落下标顶歪，
       所以先把这两项关掉；章版式本身由第 8 节单独覆盖。 */
    await openLevel('h1');
    var cbPB = doc.querySelector('input[data-f="chapterPageBreak"]');
    var cbBL = doc.querySelector('input[data-f="chapterBlanks"]');
    t('一级标题这一页能看到「章版式」两个开关', !!cbPB && !!cbBL);
    t('预设默认勾选了「每章另起一页」', !!cbPB && cbPB.checked);
    t('预设默认勾选了「标题上下各空一行」', !!cbBL && cbBL.checked);
    await setChapter(false, false);
    var offPB = doc.querySelector('input[data-f="chapterPageBreak"]');
    var offBL = doc.querySelector('input[data-f="chapterBlanks"]');
    t('取消勾选后 DOM 同步为未勾选', offPB && !offPB.checked && offBL && !offBL.checked);

    /* ============================ 2. 识别结果 ============================ */
    log('\n=== 2. 上传夹具文档（含空标题样式段 / 手打编号标题 / 无样式题注） ===');
    await loadFixture('headings.docx');
    t('目标文档已载入', !!doc.getElementById('chip-doc') && !doc.getElementById('chip-doc').hidden);

    var r = capturedReport;
    log('\n=== 3. 识别结果统计 ===');
    log('  ' + JSON.stringify(r));
    t('一级标题 = 2', r.headings[1] === 2, r.headings[1]);
    t('二级标题 = 2', r.headings[2] === 2, r.headings[2]);
    t('三级标题 = 2（1.1.1 与手打的 1.1.2 都算三级）', r.headings[3] === 2, r.headings[3]);
    t('题注 = 2', r.caption === 2, r.caption);
    t('空段落计数 = 2', r.blankParagraphs === 2, r.blankParagraphs);
    t('摘掉标题样式的空段 = 2', r.demotedHeadings === 2, r.demotedHeadings);
    t('关掉章版式后不再加分页 / 空行',
      r.chapterBreaks === 0 && r.chapterBlanks === 0, JSON.stringify({ b: r.chapterBreaks, n: r.chapterBlanks }));

    log('\n=== 4. 页面结果区文案 ===');
    log('  ' + noteTxt().slice(0, 200));
    t('结果说明里解释了「空段落原带标题样式」已按正文处理',
      /空段落原本套着标题样式/.test(noteTxt()), noteTxt().slice(0, 120));
    var subTxt = doc.getElementById('result-sub').textContent;
    t('结果副标题含三级标题明细', /标题 3 × 2/.test(subTxt), subTxt);

    log('\n=== 5. 产物 XML 校验 ===');
    var xml = await docXml();
    var ps = parasOf(xml);

    t('空段（第1段）不再是标题样式（换成了正文样式）',
      !/w:pStyle w:val="[2345]"\/>/.test(ps[0]), ps[0].slice(0, 160));
    t('空段（第1段）按正文小四处理', /<w:sz w:val="24"\/>/.test(ps[0]), ps[0].slice(0, 220));
    t('空段（第1段）不再带大纲级别', !/<w:outlineLvl/.test(ps[0]));
    t('空段（第1段）没有首行缩进',
      !/<w:ind/.test(ps[0]) || /<w:ind\b[^>]*w:firstLineChars="0"/.test(ps[0]), ps[0].slice(0, 220));

    t('第1章 → 小二(36) 黑体居中',
      /<w:sz w:val="36"\/>/.test(ps[1]) && /w:eastAsia="黑体"/.test(ps[1]) && /<w:jc w:val="center"\/>/.test(ps[1]),
      ps[1].slice(0, 220));
    t('1.1 → 小三(30) 段前12磅',
      /<w:sz w:val="30"\/>/.test(ps[3]) && /w:before="240"/.test(ps[3]), ps[3].slice(0, 220));
    t('1.1.1 → 四号(28)',
      /<w:sz w:val="28"\/>/.test(ps[4]) && /w:before="160"/.test(ps[4]), ps[4].slice(0, 220));
    t('手打的「1.1.2 …」→ 四号(28) 而不是小三(30)',
      /<w:sz w:val="28"\/>/.test(ps[5]) && !/<w:sz w:val="30"\/>/.test(ps[5]), ps[5].slice(0, 220));
    t('手打的「第2章 …」→ 小二(36) 居中',
      /<w:sz w:val="36"\/>/.test(ps[6]) && /<w:jc w:val="center"\/>/.test(ps[6]));
    t('「表2-1 …」→ 题注 五号(21) 居中',
      /<w:sz w:val="21"\/>/.test(ps[8]) && /<w:jc w:val="center"\/>/.test(ps[8]), ps[8].slice(0, 220));
    t('「图2-1 …」→ 题注 五号(21) 居中',
      /<w:sz w:val="21"\/>/.test(ps[9]) && /<w:jc w:val="center"\/>/.test(ps[9]), ps[9].slice(0, 220));
    t('正文 → 小四(24) + 首行缩进2字符',
      /<w:sz w:val="24"\/>/.test(ps[10]) && /firstLineChars="200"/.test(ps[10]), ps[10].slice(0, 220));

    /* 标题样式 basedOn 正文，正文带 2 字符缩进 —— 标题必须显式写 0 才能截断继承 */
    t('一级标题显式写了 0 缩进',
      /<w:ind\b[^>]*w:firstLineChars="0"/.test(ps[1]), ps[1].slice(0, 220));
    t('二级标题显式写了 0 缩进',
      /<w:ind\b[^>]*w:firstLineChars="0"/.test(ps[3]), ps[3].slice(0, 220));
    var styAll = await stylesXml();
    var styBlocks = styAll.split('<w:style ').slice(1);
    var h2Def = styBlocks.filter(function (s) { return /<w:name w:val="heading 2"\/>/.test(s); })[0] || '';
    t('样式「标题 2」定义里也写了 0 缩进',
      /<w:ind\b[^>]*w:firstLineChars="0"/.test(h2Def), h2Def.slice(0, 260));

    /* ============================ 6. 样式整体错位 ============================ */
    log('\n=== 6. 标题样式整体错位一级的文档 ===');
    await loadFixture('shifted-styles.docx');
    var r2 = capturedReport;
    log('  ' + JSON.stringify(r2));
    t('纠正了 3 处错位的标题层级', r2.levelFixes === 3, r2.levelFixes);
    t('一级标题 = 2（第1章 + 一、）', r2.headings[1] === 2, JSON.stringify(r2.headings));
    t('二级标题 = 1（1.1 被纠正上来）', r2.headings[2] === 1, JSON.stringify(r2.headings));
    t('三级标题 = 1（1.1.1 被纠正上来）', r2.headings[3] === 1, JSON.stringify(r2.headings));
    t('结果说明里提示了「标题样式和实际层级对不上」',
      /标题样式和实际层级对不上/.test(noteTxt()), noteTxt().slice(0, 120));

    var ps2 = parasOf(await docXml());
    t('「第1章」→ 小二(36) 居中 + outlineLvl 0',
      /<w:sz w:val="36"\/>/.test(ps2[0]) && /<w:jc w:val="center"\/>/.test(ps2[0]) && /<w:outlineLvl w:val="0"\/>/.test(ps2[0]),
      ps2[0].slice(0, 220));
    t('「1.1」→ 小三(30) + outlineLvl 1',
      /<w:sz w:val="30"\/>/.test(ps2[1]) && /<w:outlineLvl w:val="1"\/>/.test(ps2[1]), ps2[1].slice(0, 220));
    t('「1.1.1」→ 四号(28) + outlineLvl 2',
      /<w:sz w:val="28"\/>/.test(ps2[2]) && /<w:outlineLvl w:val="2"\/>/.test(ps2[2]), ps2[2].slice(0, 220));
    t('「一、项目背景」不被压低，仍为小二(36) 居中',
      /<w:sz w:val="36"\/>/.test(ps2[3]) && /<w:jc w:val="center"\/>/.test(ps2[3]), ps2[3].slice(0, 220));

    /* pStyle 必须跟着层级走，否则 Word 样式库 / 样式检查器显示的是错的名字 */
    t('第1章 的 pStyle 指向「标题 1」',
      /w:pStyle w:val="2"\/>/.test(ps2[0]), ps2[0].slice(0, 120));
    t('1.1 的 pStyle 指向「标题 2」',
      /w:pStyle w:val="3"\/>/.test(ps2[1]), ps2[1].slice(0, 120));
    t('1.1.1 的 pStyle 指向「标题 3」',
      /w:pStyle w:val="4"\/>/.test(ps2[2]), ps2[2].slice(0, 120));

    var sty2 = await stylesXml();
    var blocks2 = sty2.split('<w:style ').slice(1).map(function (s) { return '<w:style ' + s; });
    var h1b = blocks2.filter(function (s) { return /<w:name w:val="heading 1"\/>/.test(s); })[0] || '';
    var h2b = blocks2.filter(function (s) { return /<w:name w:val="heading 2"\/>/.test(s); })[0] || '';
    t('样式「标题 1」的定义已重写为 小二(36) 居中 + outlineLvl 0',
      /<w:sz w:val="36"\/>/.test(h1b) && /<w:jc w:val="center"\/>/.test(h1b) && /<w:outlineLvl w:val="0"\/>/.test(h1b),
      h1b.slice(0, 260));
    t('样式「标题 2」的定义已重写为 小三(30) + outlineLvl 1',
      /<w:sz w:val="30"\/>/.test(h2b) && /<w:outlineLvl w:val="1"\/>/.test(h2b), h2b.slice(0, 260));

    /* ============================ 7. 清掉遗留的水平线 ============================ */
    log('\n=== 7. 清掉遗留的水平线（markdown 的 ---） ===');
    await loadFixture('rules.docx');
    var r3 = capturedReport;
    log('  ' + JSON.stringify(r3));
    t('统计到 2 条水平线', r3.removedRules === 2, r3.removedRules);
    t('结果说明里提示了「清掉遗留的水平线」',
      /遗留的水平线/.test(noteTxt()), noteTxt().slice(0, 160));

    var xml3 = await docXml();
    t('产物里已无 o:hr 水平线图形', !/o:hr\s*=/.test(xml3));
    t('产物里已无 w:pict', !/<w:pict/.test(xml3));
    var ps3 = parasOf(xml3);
    t('只装水平线的那段被整段删除（6 段 → 5 段）', ps3.length === 5, ps3.length);
    t('「文字 + 水平线」的段落保留了文字',
      ps3.some(function (p) { return /带线的正文段落/.test(p); }));
    t('第1章 / 第2章 两章标题仍完好',
      ps3.filter(function (p) { return /第[12]章/.test(p) && /w:outlineLvl/.test(p); }).length === 2);

    /* ============================ 8. 一级标题（章）版式 ============================ */
    log('\n=== 8. 一级标题（章）版式 ===');
    await setChapter(true, true);

    await loadFixture('chapters.docx');
    var r4 = capturedReport;
    log('  ' + JSON.stringify({ breaks: r4.chapterBreaks, blanks: r4.chapterBlanks, h: r4.headings }));
    t('三章都识别为一级标题', r4.headings[1] === 3, JSON.stringify(r4.headings));
    t('三章都加了分页（第1章前面本来就有内容）', r4.chapterBreaks === 3, r4.chapterBreaks);
    t('备好 6 个空行（3 章 × 前后各 1）', r4.chapterBlanks === 6, r4.chapterBlanks);
    t('结果说明里提示了「每章另起一页」', /每章另起一页/.test(noteTxt()), noteTxt().slice(0, 200));

    var ps4 = parasOf(await docXml());
    var tx4 = ps4.map(textOf);
    log('  段落序列: ' + tx4.map(function (s) { return s ? s.slice(0, 12) : '(空)'; }).join(' | '));
    ['第1章 绪论', '第2章 系统设计', '第3章 结论'].forEach(function (title) {
      var i = tx4.indexOf(title);
      var name = title.slice(0, 2);
      t(name + ' 前一行是空行', i > 0 && tx4[i - 1] === '', i);
      t(name + ' 后一行是空行', i >= 0 && tx4[i + 1] === '', i);
      t(name + ' 前的空行带分页符', i > 0 && /<w:pageBreakBefore\/>/.test(ps4[i - 1]));
      t(name + ' 前的空行是一级标题格式（黑体 小二36）',
        i > 0 && /w:eastAsia="黑体"/.test(ps4[i - 1]) && /<w:sz w:val="36"\/>/.test(ps4[i - 1]));
      t(name + ' 后的空行同样是一级标题格式',
        i >= 0 && /w:eastAsia="黑体"/.test(ps4[i + 1]) && /<w:sz w:val="36"\/>/.test(ps4[i + 1]));
      t(name + ' 章标题本身仍居中', i >= 0 && /<w:jc w:val="center"\/>/.test(ps4[i]));
    });
    var titleBlanks = ps4.filter(function (p) { return !textOf(p) && /w:eastAsia="黑体"/.test(p); });
    t('标题格式空行共 6 个且都没有首行缩进',
      titleBlanks.length === 6 && titleBlanks.every(function (p) { return /w:firstLineChars="0"/.test(p); }),
      titleBlanks.length);
    var h2i4 = tx4.findIndex(function (s) { return /^1\.1 /.test(s); });
    t('二级标题自己没被加分页符', h2i4 > 0 && !/<w:pageBreakBefore\/>/.test(ps4[h2i4]));
    t('二级标题前一行不是标题格式的空行',
      h2i4 > 0 && !/w:eastAsia="黑体"/.test(ps4[h2i4 - 1]));

    /* 第1章本来就在文档开头：不该再分页，但空行照加 */
    await loadFixture('chapters-first.docx');
    t('第1章在文档开头时少一次分页（2 章 → 1 次）', capturedReport.chapterBreaks === 1, capturedReport.chapterBreaks);
    t('第1章在文档开头时空行照加（2 章 × 2 = 4）', capturedReport.chapterBlanks === 4, capturedReport.chapterBlanks);
    var ps5 = parasOf(await docXml());
    t('文档开头那个空行不带分页符',
      !/<w:pageBreakBefore\/>/.test(ps5[0]) && /w:eastAsia="黑体"/.test(ps5[0]), ps5[0].slice(0, 200));

    /* 标题上下原本就有空行：就地改造，不叠成两行 */
    await loadFixture('pre-blanked.docx');
    log('  复用已有空行: ' + JSON.stringify({ b: capturedReport.chapterBreaks, n: capturedReport.chapterBlanks }));
    t('复用原有空行：2 章 → 2 次分页 / 4 个空行，不新增段落',
      capturedReport.chapterBreaks === 2 && capturedReport.chapterBlanks === 4,
      JSON.stringify({ b: capturedReport.chapterBreaks, n: capturedReport.chapterBlanks }));
    var ps6 = parasOf(await docXml());
    t('复用后段落数 = 原文 6 + 新增 2', ps6.length === 8, ps6.length);
    t('被复用的那个空行拿到了分页符',
      /<w:pageBreakBefore\/>/.test(ps6[1]) && !textOf(ps6[1]), ps6[1].slice(0, 160));

    /* 关掉开关：版式完全不生效 */
    await setChapter(false, false);
    await loadFixture('chapters.docx');
    t('关掉开关后既不分页也不插空行',
      capturedReport.chapterBreaks === 0 && capturedReport.chapterBlanks === 0,
      JSON.stringify({ b: capturedReport.chapterBreaks, n: capturedReport.chapterBlanks }));
    var ps7 = parasOf(await docXml());
    t('关掉开关后段落数 = 原文 7 段', ps7.length === 7, ps7.length);

    log('\n---------------------------------------');
    log('  通过 ' + pass + ' 项，失败 ' + fail + ' 项');
    log('  DONE pass=' + pass + ' fail=' + fail);
    log('---------------------------------------');
  } catch (e) {
    log('\nEXCEPTION ' + (e && e.stack || e));
    log('DONE pass=' + pass + ' fail=' + (fail + 1));
  }
})();
</script>
</body>
</html>
